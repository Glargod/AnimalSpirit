<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spirit Vibe Quiz</title>
  <style>
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(#0f0f0f, #2f2f2f);
      color: #f0e6d6;
      margin: 0;
      padding: 0;
    }
    header {
      background: #1c1c1c;
      padding: 20px;
      text-align: center;
      position: sticky;
      top: 0;
      z-index: 999;
      border-bottom: 2px solid #444;
    }
    header h1 {
      margin: 0;
      font-size: 2em;
    }
    main {
      padding: 20px;
      max-width: 800px;
      margin: auto;
    }
    .question {
      margin-bottom: 15px;
    }
    .question-title {
      font-weight: bold;
    }
    .choices label {
      display: block;
      margin: 5px 0;
    }
    button {
      margin: 10px 5px;
      padding: 10px 20px;
      font-size: 1em;
      cursor: pointer;
    }
    .result {
      border-top: 2px solid #888;
      padding-top: 20px;
      margin-top: 20px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Spirit Vibe Quiz</h1>
    <p>Discover your spirit animal by the firelight of your soul</p>
  </header>
  <main>
    <form id="quizForm"></form>
    <button onclick="submitQuiz()">Submit</button>
    <button onclick="resetQuiz()">Reset</button>
    <div class="result" id="result"></div>
  </main>
  <script>
    const questions = [];
    const dichotomies = {
      EI: [
        "Do you feel energized by social events?",
        "Do you prefer to talk through ideas rather than think them through alone?",
        "Do you enjoy being the center of attention?",
        "Do you often initiate conversations?",
        "Do you prefer group work over solo tasks?",
        "Do you find it easy to meet new people?",
        "Do you get restless when you’re alone for too long?",
        "Do you think best while talking?"
      ],
      SN: [
        "Do you trust facts more than ideas?",
        "Do you prefer practical experience to abstract theories?",
        "Do you notice details others miss?",
        "Do you focus more on what is than what could be?",
        "Do you like step-by-step instructions?",
        "Do you find it easier to work with what’s real and proven?",
        "Do you value tradition over innovation?",
        "Do you describe things literally rather than metaphorically?"
      ],
      TF: [
        "Do you make decisions with your head over your heart?",
        "Do you value truth over tact?",
        "Do you prioritize logic over emotion?",
        "Do you believe fairness means treating everyone the same?",
        "Do you argue for clarity even if it causes tension?",
        "Do you stay calm in emotionally charged situations?",
        "Do you critique more than compliment?",
        "Do you feel uncomfortable with emotional displays?"
      ],
      JP: [
        "Do you prefer scheduled events over spontaneous ones?",
        "Do you make lists and follow them?",
        "Do you feel stressed when plans change?",
        "Do you finish tasks early rather than last-minute?",
        "Do you like having things decided?",
        "Do you organize everything around you?",
        "Do you dislike surprises?",
        "Do you value structure in your day?"
      ],
      PA: [
        "Would you rather avoid conflict than confront it?",
        "Do you forgive easily?",
        "Do you believe most people are good at heart?"
      ],
      RF: [
        "Would you trust a dragon to protect you?",
        "Do you believe mythical creatures could exist?",
        "Do you prefer fantasy stories to documentaries?",
        "Would you befriend a unicorn over a horse?",
        "Do you feel more drawn to legends than real history?"
      ]
    };

    let idCounter = 1;
    for (const [key, list] of Object.entries(dichotomies)) {
      for (let i = 0; i < list.length; i++) {
        questions.push({
          id: key + i,
          dichotomy: key,
          text: list[i],
          a: key[0],
          b: key[1]
        });
      }
    }

    // Animal results
    const results = {
      "ISTJ-Real-Peaceful": { name: "Bee", description: "A structured and community-driven insect known for its hard work and cooperation.", link: "https://en.wikipedia.org/wiki/Bee" },
      "ISTJ-Real-Hostile": { name: "Northern Goshawk", description: "A fierce bird of prey with unmatched focus and precision.", link: "https://en.wikipedia.org/wiki/Northern_goshawk" },
      "ISTJ-Fiction-Peaceful": { name: "Komainu", description: "A guardian spirit lion-dog of Japanese folklore, embodying loyalty and protection.", link: "https://en.wikipedia.org/wiki/Komainu" },
      "ISTJ-Fiction-Hostile": { name: "Gargoyle", description: "A watchful, fierce stone creature that wards off evil.", link: "https://en.wikipedia.org/wiki/Gargoyle" },
      "INTP-Fiction-Peaceful": { name: "Cecaelia", description: "A mythical being blending human and octopus features, wise and inquisitive.", link: "https://en.wikipedia.org/wiki/Cecaelia" },
      // Add the remaining 59 entries here...
    };

    const personalityNames = {
      ISTJ: ["Worker", "Earth"], ISFJ: ["Carer", "Water"], INFJ: ["Seer", "Water"], INTJ: ["Planner", "Earth"],
      ISTP: ["Fixer", "Earth"], ISFP: ["Artist", "Water"], INFP: ["Dreamy One", "Water"], INTP: ["Brain", "Earth"],
      ESTP: ["Doer", "Fire"], ESFP: ["Party Star", "Air"], ENFP: ["Dreamer", "Air"], ENTP: ["Thinker", "Fire"],
      ESTJ: ["Boss", "Fire"], ESFJ: ["Friend", "Air"], ENFJ: ["Helper", "Air"], ENTJ: ["Leader", "Fire"]
    };

    function renderQuestions() {
      const form = document.getElementById('quizForm');
      form.innerHTML = '';
      const shuffled = questions.sort(() => Math.random() - 0.5);
      shuffled.forEach(q => {
        const div = document.createElement('div');
        div.className = 'question';
        div.innerHTML = `
          <div class="question-title">${q.text}</div>
          <div class="choices">
            <label><input type="radio" name="${q.id}" value="A"> A (${q.a})</label>
            <label><input type="radio" name="${q.id}" value="B"> B (${q.b})</label>
            <label><input type="radio" name="${q.id}" value="C"> C (Not Sure)</label>
          </div>
        `;
        form.appendChild(div);
      });
    }

    function submitQuiz() {
      const formData = new FormData(document.getElementById('quizForm'));
      const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0, Peaceful: 0, Hostile: 0, Real: 0, Fiction: 0 };

      for (const q of questions) {
        const value = formData.get(q.id);
        if (!value) {
          alert('Please answer all questions before submitting.');
          return;
        }
        if (value === 'A') scores[q.a] += 1;
        else if (value === 'B') scores[q.b] += 1;
        else if (value === 'C') {
          scores[q.a] += 0.5;
          scores[q.b] += 0.5;
        }
      }

      const mbti = [scores.E >= scores.I ? 'E' : 'I', scores.S >= scores.N ? 'S' : 'N', scores.T >= scores.F ? 'T' : 'F', scores.J >= scores.P ? 'J' : 'P'].join('');
      const alignment = scores.Peaceful >= scores.Hostile ? 'Peaceful' : 'Hostile';
      const creature = (scores.Real > scores.Fiction || (scores.Real === scores.Fiction && mbti[0] === 'E')) ? 'Real' : 'Fiction';
      const key = `${mbti}-${creature}-${alignment}`;

      const result = results[key] || { name: 'Mystery Spirit', description: 'A being beyond the veil of this quiz.', link: '#' };

      const [name, element] = personalityNames[mbti] || ['Wanderer', 'Spirit'];

      const output = `
        <h2>You’re a ${name}: The ${result.name}</h2>
        <p><strong>Element:</strong> ${element}</p>
        <p>${result.description}</p>
        <p><a href="${result.link}" target="_blank">Learn more</a></p>
        <p>As a ${name.toLowerCase()}, you're tied to ${element.toLowerCase()}—like the ${element.toLowerCase()} that shapes your path. Your ${result.name} shows who you are—${result.description.toLowerCase()}</p>
      `;
      document.getElementById('result').innerHTML = output;
    }

    function resetQuiz() {
      renderQuestions();
      document.getElementById('result').innerHTML = '';
    }

    renderQuestions();
  </script>
</body>
</html>
