            `<div class="question"><p>Do you believe in things you can see or things you imagine?</p><label><input type="radio" name="q38" value="Real" required> A) Things I can see</label><label><input type="radio" name="q38" value="Fiction"> B) Things I imagine</label><label><input type="radio" name="q38" value="Both"> C) Not sure</label></div>`,
            `<div class="question"><p>Would you rather meet a lion or a dragon?</p><label><input type="radio" name="q39" value="Real" required> A) A lion</label><label><input type="radio" name="q39" value="Fiction"> B) A dragon</label><label><input type="radio" name="q39" value="Both"> C) Not sure</label></div>`,
            `<div class="question"><p>Do you like facts about nature or tales of magic?</p><label><input type="radio" name="q40" value="Real" required> A) Facts about nature</label><label><input type="radio" name="q40" value="Fiction"> B) Tales of magic</label><label><input type="radio" name="q40" value="Both"> C) Not sure</label></div>`
        ];

        const form = document.getElementById('quizForm');
        const resultDiv = document.getElementById('result');
        const errorDiv = document.getElementById('error');
        const resetButton = document.getElementById('resetButton');

        function shuffle(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
            return array;
        }

        function renderQuestions() {
            const shuffledQuestions = shuffle([...questions]);
            form.innerHTML = shuffledQuestions.join('');
        }

        renderQuestions();

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';
            try {
                const answers = {};
                for (let i = 1; i <= 40; i++) {
                    const selected = document.querySelector(`input[name="q${i}"]:checked`);
                    if (!selected) throw new Error(`Missing answer for question ${i}`);
                    answers[`q${i}`] = selected.value;
                }

                const scores = { E: 0, I: 0, S: 0, N: 0, T: 0, F: 0, J: 0, P: 0, Peaceful: 0, Hostile: 0, Real: 0, Fiction: 0 };
                for (let i = 1; i <= 40; i++) {
                    const answer = answers[`q${i}`];
                    if (i <= 8) { // E/I
                        if (answer === 'Both') {
                            scores.E += 0.5;
                            scores.I += 0.5;
                        } else {
                            scores[answer]++;
                        }
                    } else if (i <= 16) { // S/N
                        if (answer === 'Both') {
                            scores.S += 0.5;
                            scores.N += 0.5;
                        } else {
                            scores[answer]++;
                        }
                    } else if (i <= 24) { // T/F
                        if (answer === 'Both') {
                            scores.T += 0.5;
                            scores.F += 0.5;
                        } else {
                            scores[answer]++;
                        }
                    } else if (i <= 32) { // J/P
                        if (answer === 'Both') {
                            scores.J += 0.5;
                            scores.P += 0.5;
                        } else {
                            scores[answer]++;
                        }
                    } else if (i <= 35) { // Peaceful/Hostile
                        if (answer === 'Both') {
                            scores.Peaceful += 0.5;
                            scores.Hostile += 0.5;
                        } else {
                            scores[answer]++;
                        }
                    } else { // Real/Fiction (q36–q40)
                        if (answer === 'Both') {
                            scores.Real += 0.5;
                            scores.Fiction += 0.5;
                        } else {
                            scores[answer]++;
                        }
                    }
                }

                const EorI = scores.E >= scores.I ? 'E' : 'I';
                const SorN = scores.S >= scores.N ? 'S' : 'N';
                const TorF = scores.T >= scores.F ? 'T' : 'F';
                const JorP = scores.J >= scores.P ? 'J' : 'P';

                const alignment = scores.Peaceful >= scores.Hostile ? 'Peaceful' : 'Hostile';

                let isReal;
                if (scores.Real > scores.Fiction) {
                    isReal = true;
                } else if (scores.Fiction > scores.Real) {
                    isReal = false;
                } else {
                    isReal = EorI === 'E'; // Tie: E-types lean Real, I-types lean Fiction
                }

                const mbtiType = `${EorI}${SorN}${TorF}${JorP}`;
                const personality = personalityTypes[mbtiType];

                let selectedAnimal;
                if (isReal) {
                    selectedAnimal = alignment === 'Peaceful' ? personality.realPeaceful : personality.realHostile;
                } else {
                    selectedAnimal = alignment === 'Peaceful' ? personality.fictionPeaceful : personality.fictionHostile;
                }

                let revealText = `<h2>You’re a ${personality.name}: The <a href="${selectedAnimal.wikiLink}" target="_blank">${selectedAnimal.beast}</a></h2>`;
                revealText += `<p>Your animal is a ${isReal ? 'real' : 'mythical'} ${selectedAnimal.beast}! ${selectedAnimal.desc}</p>`;
                revealText += `<p><em>Why it’s you:</em> As a ${personality.name.toLowerCase()}, you’re tied to ${personality.element.toLowerCase()}—like ${personality.element === 'Fire' ? 'a big fire that’s all action' : personality.element === 'Air' ? 'the air that’s free and fun' : personality.element === 'Earth' ? 'the earth that’s strong and steady' : 'water that’s deep and caring'}. Your ${selectedAnimal.beast} shows who you are—a ${isReal ? 'real creature living in the wild' : 'mythical being from ancient stories'} with a ${alignment.toLowerCase()} heart!</p>`;

                resultDiv.innerHTML = revealText;
                resultDiv.style.display = 'block';
            } catch (err) {
                errorDiv.innerHTML = `Oops, something broke: ${err.message}. Try again!`;
                errorDiv.style.display = 'block';
            }
        });

        resetButton.addEventListener('click', () => {
            document.querySelectorAll('input[type="radio"]').forEach(radio => {
                radio.checked = false;
            });
            resultDiv.style.display = 'none';
            errorDiv.style.display = 'none';
            renderQuestions();
        });
    </script>
</body>
</html>
